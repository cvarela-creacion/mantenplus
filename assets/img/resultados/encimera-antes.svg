<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <!-- Ilustración referencial: reemplazar por foto real -->
  <defs>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EFEDE8"/><stop offset="1" stop-color="#D9D5CC"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2C2C2B"/><stop offset=".5" stop-color="#1D1C1A"/><stop offset="1" stop-color="#151413"/></linearGradient>
    <clipPath id="top"><rect x="150" y="120" width="900" height="560" rx="26"/></clipPath>
    <filter id="lime" x="0" y="0" width="1200" height="800" filterUnits="userSpaceOnUse">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" seed="5"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.92  0 0 0 0 0.91  0 0 0 0 0.88  3.2 0 0 0 -1.2"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="burn" x="0" y="0" width="1200" height="800" filterUnits="userSpaceOnUse">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="3" seed="9"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.42  0 0 0 0 0.27  0 0 0 0 0.13  6 0 0 0 -2.4"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="haze" x="0" y="0" width="1200" height="800" filterUnits="userSpaceOnUse">
      <feTurbulence type="fractalNoise" baseFrequency="0.008" numOctaves="2" seed="2"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.8  0 0 0 0 0.78  0 0 0 0 0.72  1.2 0 0 0 -.45"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#stone)"/>
  <rect x="146" y="124" width="908" height="566" rx="28" fill="#BDB6A9"/>
  <rect x="150" y="120" width="900" height="560" rx="26" fill="url(#glass)"/>
  <g fill="none" stroke="#4E4A44" stroke-width="3">
    <circle cx="380" cy="330" r="145"/><circle cx="380" cy="330" r="85" opacity=".6"/>
    <circle cx="800" cy="285" r="105"/>
    <circle cx="805" cy="500" r="120"/>
    <circle cx="380" cy="560" r="70" opacity=".8"/>
  </g>
  <g clip-path="url(#top)">
    <rect x="150" y="120" width="900" height="560" fill="#000" filter="url(#haze)"/>
    <g fill="none" stroke="#000" filter="url(#lime)">
      <circle cx="372" cy="338" r="132" stroke-width="22"/>
      <circle cx="812" cy="292" r="96" stroke-width="18"/>
      <circle cx="795" cy="508" r="110" stroke-width="20"/>
    </g>
    <g fill="#000" filter="url(#burn)">
      <ellipse cx="400" cy="350" rx="95" ry="70"/>
      <ellipse cx="790" cy="490" rx="80" ry="65"/>
      <ellipse cx="610" cy="420" rx="60" ry="30"/>
      <ellipse cx="820" cy="300" rx="40" ry="34"/>
    </g>
  </g>
  <g fill="#6E6A63">
    <circle cx="560" cy="630" r="7"/><circle cx="600" cy="630" r="7"/><circle cx="640" cy="630" r="7"/>
    <rect x="680" y="624" width="80" height="12" rx="6" fill="#47433E"/>
  </g>
</svg>
